---
# WebGoat deployment.
#
# The label `contrast-agent: java` is what the Contrast AgentInjector selects on
# (the Contrast AgentInjector is configured in helm/contrast-agent-operator.values.yaml). Nothing without that label is ever touched.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webgoat
  namespace: webgoat
  labels:
    app: webgoat
    contrast-agent: java
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webgoat
  template:
    metadata:
      labels:
        app: webgoat
        contrast-agent: java
    spec:
      initContainers:
        # Wait for the networked HSQLDB to accept connections before WebGoat starts, so
        # Flyway migrations succeed on boot. (The Contrast operator adds its own init
        # container for agent injection; both run before the app container.)
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z webgoat-db 9001; do echo 'waiting for webgoat-db:9001'; sleep 2; done"
      containers:
        - name: webgoat
          # Pinned to the latest published WebGoat release (multi-arch amd64/arm64)
          # for a reproducible demo. Runs on a JDK the Contrast Java agent supports.
          image: webgoat/webgoat:v2025.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: webgoat
              containerPort: 8080
            - name: webwolf
              containerPort: 9090
          env:
            # WebGoat binds to loopback by default, which is unreachable inside a
            # pod. These force it to listen on all interfaces.
            - name: WEBGOAT_HOST
              value: "0.0.0.0"
            - name: WEBGOAT_PORT
              value: "8080"
            # Serve WebGoat at the root context ("/") instead of the default "/WebGoat".
            # This makes the request URI match the Spring route mapping, so Contrast
            # Assess routes and ADR/Protect attack URLs line up (no "/WebGoat" prefix on
            # one and not the other). Maps to server.servlet.context-path.
            - name: WEBGOAT_CONTEXT
              value: "/"
            # Use the networked HSQLDB (manifests/05-webgoat-db.yaml) instead of the
            # in-process default, so lesson SQL travels over a TCP socket. Spring binds
            # these from env and they override application-webgoat.properties.
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:hsqldb:hsql://webgoat-db:9001/webgoat"
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "org.hsqldb.jdbc.JDBCDriver"
            - name: SPRING_DATASOURCE_USERNAME
              value: "SA"
            - name: SPRING_DATASOURCE_PASSWORD
              value: ""
            - name: WEBWOLF_HOST
              value: "0.0.0.0"
            - name: WEBWOLF_PORT
              value: "9090"
            # Some lessons are timezone-sensitive; pin it for reproducible demos.
            - name: TZ
              value: "UTC"
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          startupProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: webgoat
  namespace: webgoat
  labels:
    app: webgoat
spec:
  type: ClusterIP
  selector:
    app: webgoat
  ports:
    - name: webgoat
      port: 8080
      targetPort: 8080
    - name: webwolf
      port: 9090
      targetPort: 9090
