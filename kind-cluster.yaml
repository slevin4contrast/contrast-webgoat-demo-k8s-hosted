# kind cluster config for the throwaway demo cluster (used when KIND=1).
# Maps WebGoat's ports to localhost so you can reach the UI without port-forward
# if you prefer. With kind you also get full isolation from your kubeadm cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: contrast-webgoat
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
